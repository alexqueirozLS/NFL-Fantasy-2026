<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>NFL Fantasy 2026 Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0e1a;--s1:#111827;--s2:#1e293b;--s3:#334155;
--bd:#1e293b;--bd2:#334155;
--tx:#e2e8f0;--tx2:#94a3b8;--dim:#64748b;
--ac:#3b82f6;--ac2:#60a5fa;--ac3:#1d4ed8;
--g1:#10b981;--g2:#34d399;
--r1:#ef4444;--r2:#f87171;
--y1:#f59e0b;--y2:#fbbf24;
--t1:#ef4444;--t2:#f97316;--t3:#eab308;--t4:#22c55e;--t5:#3b82f6;--t6:#8b5cf6;--t7:#ec4899;
--qb:#ec4899;--rb:#10b981;--wr:#3b82f6;--te:#f59e0b;--k:#6b7280;--ds:#a855f7;
--glow:0 0 20px rgba(59,130,246,.15);
--glow-accent:0 0 30px rgba(59,130,246,.2);
}
body{background:var(--bg);color:var(--tx);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;line-height:1.4;min-height:100vh;padding-top:env(safe-area-inset-top);-webkit-text-size-adjust:100%}
@supports(padding:env(safe-area-inset-bottom)){
  .tab-bar{padding-bottom:env(safe-area-inset-bottom)}
  .main{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:10px}::-webkit-scrollbar-thumb:hover{background:var(--dim)}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 5px rgba(59,130,246,.2)}50%{box-shadow:0 0 20px rgba(59,130,246,.4)}}
@keyframes slideDown{from{opacity:0;max-height:0}to{opacity:1;max-height:500px}}

.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--s1) 0%,#0f172a 100%);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;backdrop-filter:blur(10px)}
.hdr-title{font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--ac2),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;letter-spacing:-.3px}
.hdr-title small{font-weight:500;background:linear-gradient(135deg,var(--tx2),var(--dim));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:12px;letter-spacing:0}
.hdr-center{display:flex;gap:8px;align-items:center;flex:1;justify-content:center;flex-wrap:wrap}
.hdr-info{background:rgba(30,41,59,.8);padding:5px 12px;border-radius:8px;font-size:11px;white-space:nowrap;border:1px solid var(--bd);backdrop-filter:blur(4px);transition:all .2s}
.hdr-info:hover{border-color:var(--ac);box-shadow:var(--glow)}
.hdr-info b{color:var(--ac2);font-weight:700}
.hdr-right{display:flex;gap:8px;align-items:center}
.sync{font-size:10px;padding:4px 10px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;letter-spacing:.3px;transition:all .3s}
.sync.off{background:rgba(30,41,59,.8);color:var(--dim);border:1px solid var(--bd)}
.sync.ld{background:rgba(245,158,11,.15);color:var(--y2);border:1px solid rgba(245,158,11,.3);animation:pulse-glow 2s infinite}
.sync.ok{background:rgba(16,185,129,.15);color:var(--g2);border:1px solid rgba(16,185,129,.3)}
.sync.er{background:rgba(239,68,68,.15);color:var(--r2);border:1px solid rgba(239,68,68,.3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sync.ld .dot{animation:pulse 1.2s infinite}

.conn{background:linear-gradient(180deg,var(--s1),rgba(17,24,39,.95));border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conn input{flex:1;min-width:200px;background:rgba(15,23,42,.8);border:1px solid var(--bd2);border-radius:8px;padding:6px 12px;color:var(--tx);font-size:12px;font-family:inherit;transition:all .2s}
.conn input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.conn input::placeholder{color:var(--dim)}
.conn select{background:rgba(15,23,42,.8);border:1px solid var(--bd2);border-radius:8px;padding:6px 10px;color:var(--tx);font-size:11px;font-family:inherit;max-width:200px;transition:all .2s}
.conn select:focus{outline:none;border-color:var(--ac)}
.btn{padding:6px 14px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;letter-spacing:.3px}
.btn:active{transform:scale(.97)}
.btn-g{background:linear-gradient(135deg,#059669,#10b981);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3)}.btn-g:hover{box-shadow:0 4px 16px rgba(16,185,129,.4);transform:translateY(-1px)}
.btn-r{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.3)}.btn-r:hover{box-shadow:0 4px 16px rgba(239,68,68,.4);transform:translateY(-1px)}
.btn-s{background:var(--s2);color:var(--tx);border:1px solid var(--bd2)}.btn-s:hover{background:var(--s3)}

.main{display:grid;grid-template-columns:190px 1fr 210px;gap:0;min-height:calc(100vh - 90px)}
.col{overflow-y:auto;max-height:calc(100vh - 90px)}
.col-left{border-right:1px solid var(--bd);background:linear-gradient(180deg,var(--s1),var(--bg))}
.col-right{border-left:1px solid var(--bd);background:linear-gradient(180deg,var(--s1),var(--bg))}
.col-center{background:var(--bg);padding:10px}

.roster-hdr{padding:10px 12px;border-bottom:1px solid var(--bd);font-weight:800;font-size:11px;color:var(--ac2);position:sticky;top:0;background:linear-gradient(135deg,var(--s1),rgba(30,41,59,.95));z-index:2;letter-spacing:1px;text-transform:uppercase;backdrop-filter:blur(10px)}
.roster-slot{display:flex;align-items:center;padding:6px 12px;border-bottom:1px solid rgba(30,41,59,.5);gap:6px;font-size:11px;transition:all .2s;position:relative}
.roster-slot:hover{background:rgba(59,130,246,.05)}
.roster-slot::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--bd);transition:all .2s}
.roster-slot:has(.roster-player:not(.roster-empty))::before{background:var(--g1)}
.roster-pos{font-weight:800;min-width:32px;color:var(--dim);text-transform:uppercase;font-size:9px;letter-spacing:.5px}
.roster-player{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.roster-empty{color:var(--dim);font-style:italic;opacity:.5}
.roster-team{font-size:9px;padding:2px 5px;background:rgba(30,41,59,.8);border-radius:4px;color:var(--dim);font-weight:600;border:1px solid var(--bd)}
.roster-picks{padding:10px 12px;border-top:1px solid var(--bd);font-size:10px;color:var(--dim);position:sticky;bottom:0;background:linear-gradient(180deg,rgba(17,24,39,.95),var(--s1));backdrop-filter:blur(10px)}
.roster-picks b{color:var(--y2);font-weight:700}

.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.board-panel{background:linear-gradient(135deg,var(--s1),rgba(30,41,59,.5));border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:all .3s}
.board-panel:hover{border-color:var(--bd2);box-shadow:var(--glow)}
.board-panel-hdr{padding:8px 10px;font-weight:800;font-size:11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;position:sticky;top:0;background:linear-gradient(135deg,var(--s1),rgba(30,41,59,.95));z-index:1;backdrop-filter:blur(10px);letter-spacing:.5px}
.board-panel-hdr .pb{padding:3px 8px;border-radius:5px;font-size:9px;font-weight:900;letter-spacing:.5px}
.pb-qb{background:linear-gradient(135deg,var(--qb),#d946ef);color:#fff}.pb-rb{background:linear-gradient(135deg,var(--rb),#059669);color:#fff}
.pb-wr{background:linear-gradient(135deg,var(--wr),#2563eb);color:#fff}.pb-te{background:linear-gradient(135deg,var(--te),#d97706);color:#fff}
.pb-k{background:linear-gradient(135deg,#475569,#64748b);color:#fff}.pb-ds{background:linear-gradient(135deg,var(--ds),#7c3aed);color:#fff}
.board-panel-body{overflow-y:auto;max-height:calc((100vh - 160px)/2 - 24px);flex:1}
.tier-hdr{display:flex;align-items:center;gap:6px;padding:5px 10px;background:rgba(30,41,59,.5);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);border-bottom:1px solid var(--bd)}
.tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.prow{display:flex;align-items:center;padding:4px 10px;gap:6px;border-bottom:1px solid rgba(30,41,59,.3);font-size:11px;cursor:pointer;transition:all .15s;position:relative}
.prow:hover{background:rgba(59,130,246,.08)}
.prow.done{opacity:.25}.prow.done .pn{text-decoration:line-through;color:var(--dim)}
.pchk{width:16px;height:16px;border-radius:4px;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;cursor:pointer;transition:all .2s}
.pchk:hover{border-color:var(--ac)}
.pchk.on{background:linear-gradient(135deg,var(--ac),var(--ac3));border-color:var(--ac);box-shadow:0 0 8px rgba(59,130,246,.4)}
.pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;transition:color .2s}
.ptm{font-size:9px;padding:2px 5px;background:rgba(30,41,59,.8);border-radius:4px;color:var(--dim);font-weight:700;border:1px solid var(--bd)}

.bpa-hdr{padding:10px 12px;border-bottom:1px solid var(--bd);font-weight:800;font-size:11px;color:var(--ac2);position:sticky;top:0;background:linear-gradient(135deg,var(--s1),rgba(30,41,59,.95));z-index:2;letter-spacing:1px;text-transform:uppercase;backdrop-filter:blur(10px)}
.bpa-row{display:flex;align-items:center;padding:5px 10px;gap:6px;border-bottom:1px solid rgba(30,41,59,.3);font-size:11px;transition:all .15s}
.bpa-row:hover{background:rgba(59,130,246,.05)}
.bpa-rank{min-width:18px;color:var(--dim);font-weight:800;font-size:10px;text-align:right}
.bpa-pos{font-size:9px;font-weight:900;padding:2px 5px;border-radius:4px;min-width:26px;text-align:center;letter-spacing:.3px}
.bpa-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bpa-adp{font-size:9px;min-width:24px;text-align:right;font-weight:800;padding:2px 4px;border-radius:4px}
.bpa-adp.steal{background:rgba(16,185,129,.15);color:var(--g2)}.bpa-adp.fair{background:rgba(245,158,11,.15);color:var(--y2)}.bpa-adp.reach{background:rgba(239,68,68,.15);color:var(--r2)}
.bpa-tm{font-size:9px;color:var(--dim);font-weight:600}
.prow .adp-tag{font-size:8px;padding:2px 5px;border-radius:4px;font-weight:800;letter-spacing:.3px}
.adp-steal{background:rgba(16,185,129,.15);color:var(--g2)}.adp-fair{background:rgba(245,158,11,.15);color:var(--y2)}.adp-reach{background:rgba(239,68,68,.15);color:var(--r2)}

.strat{background:linear-gradient(135deg,var(--s1),rgba(30,41,59,.5));border:1px solid var(--bd);border-radius:10px;margin-top:10px;overflow:hidden;transition:all .3s}
.strat:hover{border-color:var(--bd2);box-shadow:var(--glow)}
.strat-hdr{padding:8px 12px;font-weight:800;font-size:11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--s2),rgba(30,41,59,.8));letter-spacing:.5px}
.strat-hdr .icon{font-size:14px}
.strat-body{padding:10px;font-size:11px;line-height:1.6}
.strat-section{margin-bottom:10px}
.strat-section h4{font-size:10px;color:var(--ac2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:800}
.strat-item{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(30,41,59,.4);transition:all .2s}
.strat-item:last-child{border-bottom:none}
.strat-item:hover{padding-left:4px}
.strat-item .pos{font-size:9px;font-weight:900;padding:2px 5px;border-radius:4px;min-width:26px;text-align:center;letter-spacing:.3px}
.strat-item .val{color:var(--g2);font-weight:800;font-size:10px;letter-spacing:.3px}
.strat-alert{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:6px;padding:8px;margin-top:6px;font-size:10px;color:var(--r2);font-weight:600}
.strat-tip{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:6px;padding:8px;margin-top:6px;font-size:10px;color:var(--ac2)}

.bbar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,var(--s1),rgba(15,23,42,.98));border-top:1px solid var(--bd);padding:6px 14px;display:flex;gap:6px;overflow-x:auto;z-index:100;white-space:nowrap;backdrop-filter:blur(10px)}
.bbar-label{font-size:10px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:3px 0;flex-shrink:0}
.bpick{font-size:10px;padding:4px 10px;background:rgba(30,41,59,.8);border-radius:6px;flex-shrink:0;border:1px solid var(--bd);transition:all .2s}
.bpick:hover{border-color:var(--ac);box-shadow:var(--glow)}
.bpick b{color:var(--ac2);font-weight:800}
.bpick span{color:var(--dim)}

-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mob-toggle{display:none;position:fixed;bottom:52px;right:12px;z-index:200;background:linear-gradient(135deg,var(--ac),var(--ac3));color:#fff;border:none;border-radius:14px;width:48px;height:48px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(59,130,246,.4);transition:all .2s;letter-spacing:.5px}
.mob-toggle:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(59,130,246,.5)}

/* TABLET TAB BAR */
.tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:150;background:linear-gradient(135deg,var(--s1),rgba(15,23,42,.98));border-top:1px solid var(--bd);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
.tab-bar-inner{display:flex;justify-content:stretch;align-items:stretch}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px 10px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;position:relative}
.tab-btn .tab-icon{font-size:20px;line-height:1}
.tab-btn.active{color:var(--ac2)}
.tab-btn.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:0 0 2px 2px}
.tab-btn:active{background:rgba(59,130,46,.08)}

/* TABLET PORTRAIT (768-1024) */
@media(min-width:768px)and (max-width:1024px)and (orientation:portrait){
  body{font-size:13px}
  .hdr{padding:12px 16px}
  .hdr-title{font-size:19px}
  .hdr-info{padding:6px 14px;font-size:12px}
  .conn{padding:10px 16px}
  .conn input{min-width:240px;padding:8px 14px;font-size:13px;border-radius:10px}
  .conn select{padding:8px 12px;font-size:12px;border-radius:10px;max-width:220px}
  .btn{padding:8px 18px;font-size:12px;border-radius:10px;min-height:40px}

  .main{grid-template-columns:1fr;grid-template-rows:1fr;padding-bottom:72px}
  .col{max-height:none;border:none !important}
  .col-left,.col-right{display:none;position:fixed;top:0;left:0;right:0;bottom:72px;z-index:120;background:var(--bg);overflow-y:auto;padding:0}
  .col-left.tablet-active,.col-right.tablet-active,.col-center.tablet-active{display:block}
  .col-center.tablet-active{padding:12px}
  .tab-bar{display:block}
  .mob-toggle{display:none !important}

  .board-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .board-panel-body{max-height:calc(100vh - 240px)}
  .prow{padding:6px 12px;gap:8px;font-size:12px;min-height:40px}
  .pchk{width:20px;height:20px;border-radius:5px;border:2px solid var(--bd2);font-size:11px}
  .pn{font-size:12px}
  .ptm{font-size:10px;padding:3px 6px;border-radius:5px}
  .adp-tag{font-size:9px !important;padding:3px 6px !important}

  .roster-slot{padding:8px 14px;gap:8px;font-size:12px;min-height:36px}
  .roster-pos{font-size:10px;min-width:36px}
  .roster-player{font-size:12px}

  .bpa-row{padding:7px 14px;gap:8px;font-size:12px;min-height:36px}
  .bpa-rank{font-size:11px;min-width:22px}
  .bpa-pos{font-size:10px;padding:3px 6px;border-radius:5px;min-width:30px}
  .bpa-name{font-size:12px}
  .bpa-adp{font-size:10px;padding:3px 5px;border-radius:5px}

  .strat-body{padding:12px;font-size:12px}
  .strat-item{padding:5px 0;gap:8px}
  .strat-item .pos{font-size:10px;padding:3px 6px;border-radius:5px;min-width:30px}
  .strat-item .val{font-size:11px}

  .bbar{display:none !important}
}

/* TABLET LANDSCAPE (1024-1366) */
@media(min-width:1024px)and (max-width:1366px)and (orientation:landscape){
  body{font-size:12px}
  .main{grid-template-columns:180px 1fr 200px}
  .prow{padding:5px 10px;min-height:34px}
  .pchk{width:18px;height:18px}
  .bpa-row{padding:5px 10px;min-height:34px}
  .roster-slot{padding:5px 10px;min-height:32px}
  .bbar{padding:6px 14px}
}

/* MOBILE < 768 */
@media(max-width:767px){
  body{font-size:13px}
  .hdr{padding:10px 12px;gap:8px}
  .hdr-title{font-size:16px}
  .hdr-info{padding:5px 10px;font-size:11px}
  .conn{padding:8px 12px}
  .conn input{min-width:180px;padding:8px 12px;font-size:13px;border-radius:10px}
  .conn select{padding:8px 10px;font-size:12px;border-radius:10px}
  .btn{padding:8px 16px;font-size:12px;min-height:40px;border-radius:10px}

  .main{grid-template-columns:1fr;grid-template-rows:1fr;padding-bottom:72px}
  .col{max-height:none;border:none !important}
  .col-left,.col-right{display:none;position:fixed;top:0;left:0;right:0;bottom:72px;z-index:120;background:var(--bg);overflow-y:auto;padding:0}
  .col-left.mobile-active,.col-right.mobile-active,.col-center.mobile-active{display:block}
  .col-center.mobile-active{padding:10px}
  .tab-bar{display:block}
  .mob-toggle{display:none !important}

  .board-grid{grid-template-columns:1fr;gap:8px}
  .board-panel-body{max-height:calc(100vh - 220px)}
  .prow{padding:6px 10px;gap:7px;font-size:13px;min-height:42px}
  .pchk{width:22px;height:22px;border-radius:6px;font-size:12px}
  .pn{font-size:13px}
  .ptm{font-size:10px;padding:3px 6px;border-radius:5px}
  .adp-tag{font-size:9px !important;padding:3px 6px !important}
  .tier-hdr{padding:6px 10px;font-size:10px}
  .board-panel-hdr{padding:10px 12px;font-size:12px}

  .roster-slot{padding:8px 12px;gap:8px;font-size:13px;min-height:38px}
  .roster-pos{font-size:10px;min-width:36px}
  .roster-player{font-size:13px}
  .roster-hdr,.bpa-hdr{padding:12px;font-size:12px;letter-spacing:1.5px}

  .bpa-row{padding:8px 12px;gap:8px;font-size:13px;min-height:38px}
  .bpa-rank{font-size:11px;min-width:22px}
  .bpa-pos{font-size:10px;padding:3px 6px;border-radius:5px;min-width:30px}
  .bpa-name{font-size:13px}
  .bpa-adp{font-size:10px;padding:3px 5px;border-radius:5px}

  .strat-body{padding:12px;font-size:12px}
  .strat-item{padding:5px 0;gap:8px}
  .strat-item .pos{font-size:10px;padding:3px 6px;border-radius:5px;min-width:30px}
  .strat-item .val{font-size:11px}

  .bbar{display:none !important}
}

/* LARGE TABLETS / SMALL DESKTOPS */
@media(min-width:1025px)and (max-width:1200px){
  .main{grid-template-columns:170px 1fr 190px}

function setSync(c,t){const b=document.getElementById('syncBadge'),x=document.getElementById('syncTxt');b.className='sync '+c;x.textContent=t}

async function doConnect(){
  const input=document.getElementById('leagueIn').value.trim();
  if(!input)return;
  setSync('ld','A ligar...');
  document.getElementById('connBtn').textContent='...';
  try{
    const lid=input.replace(/.*\//,'');
    const lr=await fetch(API+'/league/'+lid);
    if(!lr.ok)throw new Error('Liga não encontrada');
    const ld=await lr.json();
    state.leagueId=lid;
    state.draftId=ld.draft_id;
    state.numTeams=ld.total_rosters||12;
    state.totalRounds=(ld.settings&&ld.settings.draft_rounds)||15;

    const dr=await fetch(API+'/draft/'+state.draftId);
    if(!dr.ok)throw new Error('Draft não encontrado');
    const dd=await dr.json();
    state.draftOrder=dd.draft_order||{};
    state.slotToRoster=dd.slot_to_roster_id||{};
    state.pickTimer=(dd.settings&&dd.settings.pick_timer)||120;
    if(dd.settings){state.totalRounds=dd.settings.rounds||state.totalRounds;state.numTeams=dd.settings.teams||state.numTeams}

    const pr=await fetch(API+'/draft/'+state.draftId+'/picks');
    if(pr.ok){state.draftPicks=await pr.json()||[]}
    state.draftStatus=dd.status||'pre_draft';

    const ur=await fetch(API+'/league/'+lid+'/users');
    if(ur.ok){state.users=await ur.json()||[]}

    const rr=await fetch(API+'/league/'+lid+'/rosters');
    if(rr.ok){state.rosters=await rr.json()||[]}

    populateUsers();
    setSync('ok','Ligado');
    document.getElementById('connBtn').textContent='LIGAR';
    document.getElementById('discBtn').style.display='';
    document.getElementById('discBtn').onclick=doDisconnect;

    if(state.userId)identifyUser();
    markDraftedFromPicks();
    startPolling();
    renderAll();
  }catch(e){
    console.error('Connect error:',e);
    setSync('er','Erro: '+e.message);
    document.getElementById('connBtn').textContent='LIGAR';
  }
}

function doDisconnect(){
  if(state.pollTimer){clearInterval(state.pollTimer);state.pollTimer=null}
  state.draftPicks=[];state.users=[];state.rosters=[];state.draftOrder={};state.slotToRoster={};
  state.draftId=null;state.draftStatus='pre_draft';state.userRosterId=null;
  setSync('off','Offline');
  document.getElementById('discBtn').style.display='none';
  document.getElementById('userSel').innerHTML='<option value="">Select your team...</option>';
  document.getElementById('hRound').textContent='Draft: --';
  document.getElementById('hClock').textContent='Clock: --';
  document.getElementById('hNext').style.display='none';
  renderAll();
}

function populateUsers(){
  const sel=document.getElementById('userSel');
  sel.innerHTML='<option value="">Select your team...</option>';
  state.users.filter(u=>!u.is_bot).forEach(u=>{
    const opt=document.createElement('option');
    opt.value=u.user_id;
    opt.textContent=u.metadata&&u.metadata.team_name?u.metadata.team_name:u.display_name;
    if(u.user_id===state.userId)opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=function(){state.userId=this.value;localStorage.setItem('sleeper_uid',this.value);identifyUser();renderAll()};
}

function identifyUser(){
  if(!state.userId||!state.rosters.length)return;
  const roster=state.rosters.find(r=>r.owner_id===state.userId);
  state.userRosterId=roster?roster.roster_id:null;
}

function markDraftedFromPicks(){
  state.draftPicks.forEach(p=>{
    if(p.player_id&&p.player_id!=='0'&&p.player_id!=='Avoid'){
      const key=String(p.player_id);
      state.drafted[key]={by:'sleeper',pick:p.pick,round:p.round,roster_id:p.roster_id};
    }
  });
}

function startPolling(){
  if(state.pollTimer)clearInterval(state.pollTimer);
  state.pollTimer=setInterval(async()=>{
    try{
      const pr=await fetch(API+'/draft/'+state.draftId+'/picks');
      if(pr.ok){
        const picks=await pr.json()||[];
        if(picks.length!==state.draftPicks.length){
          state.draftPicks=picks;
          markDraftedFromPicks();
          renderAll();
        }
      }
    }catch(e){console.error('Poll error:',e)}
  },10000);
}

/* ═══════════════════════════════════════ */
/* DRAFT MATH (SNAKE DRAFT - FIXED)       */
/* ═══════════════════════════════════════ */
function overallToRoundPick(overall){
  const t=state.numTeams;
  const round=Math.ceil(overall/t);
  const pos=(overall-1)%t;
  const pickInRound=round%2===1?pos+1:t-pos;
  return{round,pickInRound};
}

function getSlotForOverall(overall){
  const{round,pickInRound}=overallToRoundPick(overall);
  if(round%2===1)return pickInRound;
  else return state.numTeams-pickInRound+1;
}

function getTeamOnClock(){
  if(!state.draftId||state.draftPicks.length===0)return null;
  const next=state.draftPicks.length+1;
  const rp=overallToRoundPick(next);
  const slot=getSlotForOverall(next);
  const rosterId=state.slotToRoster[String(slot)];
  if(!rosterId)return null;
  const user=state.users.find(u=>{
    const r=state.rosters.find(r=>r.roster_id===rosterId);
    return r&&r.owner_id===u.user_id;
  });
  return{overall:next,...rp,teamName:user?(user.metadata&&user.metadata.team_name||user.display_name):'?',rosterId,slot};
}

function getNextPickForUser(){
  if(!state.userRosterId)return null;
  const startRd=state.draftPicks.length+1;
  for(let i=startRd;i<=state.totalRounds*state.numTeams;i++){
    const slot=getSlotForOverall(i);
    const rosterId=state.slotToRoster[String(slot)];
    if(rosterId===state.userRosterId)return{overall:i,...overallToRoundPick(i)};
  }
  return null;
}

function getUserPicks(){
  if(!state.userRosterId)return[];
  const picks=[];
  for(let i=1;i<=state.totalRounds*state.numTeams;i++){
    const slot=getSlotForOverall(i);
    const rosterId=state.slotToRoster[String(slot)];
    if(rosterId===state.userRosterId)picks.push(i);
  }
  return picks;
}

/* ═══════════════════════════════════════ */
function toggleP(idx){
  const p=PLAYERS[idx];
  const key=p.n+'|'+p.p;
  if(state.drafted[key]){delete state.drafted[key]}
  else{state.drafted[key]={by:'manual'}}
  saveDrafted();
  renderAll();
}

function isDrafted(p){
  const key=p.n+'|'+p.p;
  if(state.drafted[key])return true;
  if(state.sleeperPlayers){
    const sid=findSid(p);
    if(sid&&state.drafted[String(sid)])return true;
  }
  return false;
}

function findSid(p){
  if(!state.sleeperPlayers)return null;
  const nl=p.n.toLowerCase().replace(/[^a-z]/g,'');
  for(const id in state.sleeperPlayers){
    const sp=state.sleeperPlayers[id];
    const sn=((sp.full_name||(sp.first_name||'')+(sp.last_name||'')).toLowerCase().replace(/[^a-z]/g,''));
    if(sn===nl&&(sp.position===p.p||(sp.fantasy_positions&&sp.fantasy_positions.includes(p.p))))return id;
  }
  return null;
}

function getPlayerNameBySleeperId(id){
  if(!state.sleeperPlayers||!state.sleeperPlayers[id])return'Player #'+id;
  const sp=state.sleeperPlayers[id];
  return sp.full_name||(sp.first_name||'')+' '+(sp.last_name||'');
}

  const done=state.draftPicks.length;
  const gT=document.getElementById('hRound');
  if(done===0){gT.innerHTML='Draft: <b>pre-draft</b> ('+state.totalRounds+'rds / '+state.numTeams+'tms)'}
  else{
    const nextOverall=done+1;
    const rp=overallToRoundPick(nextOverall);
    const slot=getSlotForOverall(nextOverall);
    gT.innerHTML='R'+rp.round+' Slot '+slot+' ('+done+'/'+total+')';
  }
  const ck=document.getElementById('hClock');
  const clock=getTeamOnClock();
  if(clock){ck.innerHTML='Clock: <b>'+clock.teamName+'</b> (Slot '+clock.slot+')'}
  else if(done===0){ck.innerHTML='Clock: <b>--</b>'}
  else{ck.innerHTML='Draft: <b>Completo!</b>'}

  const hN=document.getElementById('hNext');
  if(state.userRosterId){
    const np=getNextPickForUser();
    if(np){
      const npSlot=getSlotForOverall(np.overall);
      hN.style.display='';hN.innerHTML='Your Next: <b>R'+np.round+' Slot '+npSlot+'</b> (#'+np.overall+')';
    }
    else{hN.style.display='none'}
  }else{hN.style.display='none'}
}

function renderRoster(){
  const el=document.getElementById('rosterSlots');
  let html='';
  SLOTS.forEach((slot,i)=>{
    const posLabel=slot==='DEF'?'DST':slot;
    const assigned=getRosterPlayerForSlot(i);
    html+='<div class="roster-slot"><span class="roster-pos">'+slot+'</span>';
    if(assigned){
      html+='<span class="roster-player" style="color:#f0f6fc">'+assigned.n+'</span><span class="roster-team">'+assigned.t+'</span>';
    }else{
      html+='<span class="roster-player roster-empty">'+posLabel+'</span>';
    }
    html+='</div>';
  });
  el.innerHTML=html;

  const pk=document.getElementById('rosterPicks');
  const userPicks=getUserPicks();
  if(userPicks.length){
    pk.innerHTML='Picks: '+userPicks.map(p=>'<b>#'+p+'</b>').join(', ');
  }else{
    pk.innerHTML=state.userId?'Nenhum pick restante':'Select your team ↑';
  }
}

function getRosterPlayerForSlot(slotIdx){
  if(!state.userRosterId||state.draftPicks.length===0)return null;
  const myPicks=state.draftPicks.filter(p=>p.roster_id===state.userRosterId).sort((a,b)=>a.round-b.round||a.pick-b.pick);
  if(slotIdx>=myPicks.length)return null;
  const pid=String(myPicks[slotIdx].player_id);
  if(!pid||pid==='0'||pid==='Avoid')return null;
  const nm=getPlayerNameBySleeperId(pid);
  const sp=state.sleeperPlayers?state.sleeperPlayers[pid]:null;
  return{n:nm,t:sp?sp.team:'?'};
}

function renderBoard(){
  const grid=document.getElementById('boardGrid');
  const panelMap=[
    [{pos:'QB',pb:'pb-qb'},{pos:'RB',pb:'pb-rb'},{pos:'WR',pb:'pb-wr'}],
    [{pos:'TE',pb:'pb-te'},{pos:'K',pb:'pb-k'},{pos:'DST',pb:'pb-ds'}]
  ];
  let html='';
  panelMap.forEach(row=>{
    row.forEach(({pos,pb})=>{
      html+='<div class="board-panel"><div class="board-panel-hdr"><span class="pb '+pb+'">'+pos+'</span>'+pos+'</div>';
      html+='<div class="board-panel-body">';
      const players=PLAYERS.filter(p=>p.p===pos);
      const tiers={};
      players.forEach(p=>{if(!tiers[p.ti])tiers[p.ti]=[];tiers[p.ti].push(p)});
      Object.keys(tiers).sort((a,b)=>a-b).forEach(t=>{
        const tp=tiers[t];
        html+='<div class="tier-hdr"><span class="tdot" style="background:'+TCLR[t]+';color:'+TCLR[t]+'"></span>'+TIERS[t]+' ('+tp.length+')</div>';
        tp.forEach((p,pi)=>{
          const gi=PLAYERS.indexOf(p);
          const d=isDrafted(p);
          const nextOverall=state.draftPicks.length+1;
          const adpVal=p.proj_adp||null;
          let adpTag='';
          if(adpVal&&!d){
            const diff=adpVal-nextOverall;
            if(diff>3)adpTag='<span class="adp-tag adp-steal">STEAL</span>';
            else if(diff>=-2)adpTag='<span class="adp-tag adp-fair">ADP:'+Math.round(adpVal)+'</span>';
            else adpTag='<span class="adp-tag adp-reach">REACH</span>';
          }
          html+='<div class="prow'+(d?' done':'')+'" onclick="toggleP('+gi+')">';
          html+='<div class="pchk'+(d?' on':'')+'">'+(d?'✓':'')+'</div>';
          html+='<span class="pn">'+p.n+'</span>';
          if(p.proj_pts!=null)html+='<span style="font-size:9px;color:var(--g2);white-space:nowrap;font-weight:700">'+Math.round(p.proj_pts)+'</span>';
          html+=adpTag;
          html+='<span class="ptm">'+p.t+'</span>';
          html+='</div>';
        });
      });
      html+='</div></div>';
    });
  });
  grid.innerHTML=html;
}

function renderBPA(){
  const el=document.getElementById('bpaList');
  const available=PLAYERS.filter(p=>!isDrafted(p));
  ['QB','RB','WR','TE','K','DST'].forEach(pos=>{
    let c=1;
    PLAYERS.filter(p=>p.p===pos).forEach(p=>{
      if(!isDrafted(p)){p._bpaRank=c;c++}
    });
  });
  const nextOverall=state.draftPicks.length+1;
  available.sort((a,b)=>(a._bpaRank||999)-(b._bpaRank||999));
  let html='';
  available.slice(0,60).forEach((p,i)=>{
    const pc=POS_CLR[p.p]||'ac';
    const adpVal=p.proj_adp||null;
    let adpClass='',adpText='';
    if(adpVal){
      const diff=adpVal-nextOverall;
      if(diff>3){adpClass='steal';adpText='STEAL'}
      else if(diff>=-2){adpClass='fair';adpText='ADP:'+Math.round(adpVal)}
      else{adpClass='reach';adpText='REACH'}
    }
    html+='<div class="bpa-row">';
    html+='<span class="bpa-rank">'+(i+1)+'</span>';
    html+='<span class="bpa-pos pb-'+pc+'">'+p.p+(p._bpaRank||'')+'</span>';
    html+='<span class="bpa-name">'+p.n+'</span>';
    if(adpText)html+='<span class="bpa-adp '+adpClass+'">'+adpText+'</span>';
    html+='<span class="bpa-tm">'+p.t+'</span>';
    html+='</div>';
  });
  if(!available.length)html='<div style="padding:20px;text-align:center;color:var(--dim)">Todos drafteados!</div>';
  el.innerHTML=html;
}

function renderBottomBar(){
  const el=document.getElementById('bbarPicks');
  if(!state.draftPicks.length){
    el.innerHTML='<span style="color:var(--dim)">Nenhuma pick ainda — draft não começou</span>';
    return;
  }
  const recent=state.draftPicks.slice(-15);
  el.innerHTML=recent.map(p=>{
    const nm=getPlayerNameBySleeperId(String(p.player_id));
    const user=state.users.find(u=>{
      const r=state.rosters.find(r=>r.roster_id===p.roster_id);
      return r&&r.owner_id===u.user_id;
    });
    const tn=user?(user.metadata&&user.metadata.team_name||user.display_name):'?';
    return'<span class="bpick"><b>#'+p.pick+'</b> '+nm+' <span>— '+tn+'</span></span>';
  }).join('');
}

/* ═══════════════════════════════════════ */
/* STRATEGY NOTES                         */
/* ═══════════════════════════════════════ */
function renderStrategy(){
  const el=document.getElementById('stratBody');
  if(!state.userRosterId){
    el.innerHTML='<div class="strat-tip">Selecione seu time para ver estratégias personalizadas.</div>';
    return;
  }

  const nextPick=getNextPickForUser();
  const available=PLAYERS.filter(p=>!isDrafted(p));
  const drafted=state.draftPicks;

  const posDrafted={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
  const posAvailable={QB:0,RB:0,WR:0,TE:0,DST:0};
  ['QB','RB','WR','TE','K','DST'].forEach(pos=>{
    posDrafted[pos]=drafted.filter(p=>{
      const sp=state.sleeperPlayers?state.sleeperPlayers[String(p.player_id)]:null;
      return sp&&sp.position===pos;
    }).length;
    posAvailable[pos]=PLAYERS.filter(p=>p.p===pos&&!isDrafted(p)).length;
  });

  let html='';
  const totalPicks=drafted.length;
  if(totalPicks>0){
    const alerts=[];
    if(posDrafted.QB>=4&&posAvailable.QB>8)alerts.push('QB run em andamento - '+posDrafted.QB+' QBs drafteados');
    if(posDrafted.RB>=8&&posAvailable.RB>15)alerts.push('RB run em andamento - considere agarrar um agora');
    if(posDrafted.WR>=8&&posAvailable.WR>20)alerts.push('WR run em andamento - muitos ainda disponíveis');
    if(posDrafted.TE>=3&&posAvailable.TE>5)alerts.push('TE run em andamento - elite acabando');
    if(alerts.length){
      html+='<div class="strat-section"><h4>⚠️ Position Runs</h4>';
      alerts.forEach(a=>html+='<div class="strat-alert">'+a+'</div>');
      html+='</div>';
    }
  }

  if(nextPick){
    const pickOverall=nextPick.overall;
    const bestByPos={};
    ['QB','RB','WR','TE'].forEach(pos=>{
      const posPlayers=PLAYERS.filter(p=>p.p===pos&&!isDrafted(p));
      if(posPlayers.length){
        const best=posPlayers[0];
        const adpDiff=best.proj_adp?best.proj_adp-pickOverall:0;
        bestByPos[pos]={player:best,adpDiff,value:adpDiff>2?'Excelente valor':adpDiff>0?'Bom valor':adpDiff>-2?'Justo':'Reach'};
      }
    });
    html+='<div class="strat-section"><h4>🎯 Melhores Opções no Pick #'+pickOverall+' (R'+nextPick.round+' Slot '+getSlotForOverall(pickOverall)+')</h4>';
    Object.entries(bestByPos).sort((a,b)=>(b[1].player.proj_pts||0)-(a[1].player.proj_pts||0)).forEach(([pos,{player,adpDiff,value}])=>{
      const pc=POS_CLR[pos]||'ac';
      html+='<div class="strat-item">';
      html+='<span class="pos pb-'+pc+'">'+pos+'</span>';
      html+='<span class="pn">'+player.n+' ('+player.t+')</span>';
      html+='<span class="val">'+value+'</span>';
      html+='</div>';
    });
    html+='</div>';
  }

  if(totalPicks>0&&totalPicks<state.numTeams*4){
    const myPicks=state.draftPicks.filter(p=>p.roster_id===state.userRosterId);
    const myPositions={};
    myPicks.forEach(p=>{
      const sp=state.sleeperPlayers?state.sleeperPlayers[String(p.player_id)]:null;
      if(sp)myPositions[sp.position]=(myPositions[sp.position]||0)+1;
    });
    const tradeTargets=[];
    if(!myPositions.QB)tradeTargets.push('QB backup rodada 6-8');
    if((myPositions.RB||0)<2)tradeTargets.push('RB2 rodada 3-5');
    if((myPositions.WR||0)<2)tradeTargets.push('WR2 rodada 2-4');
    if(!myPositions.TE)tradeTargets.push('TE rodada 5-7');
    if(tradeTargets.length){
      html+='<div class="strat-section"><h4>🔄 Trade Targets</h4>';
      tradeTargets.forEach(t=>html+='<div class="strat-item"><span>'+t+'</span></div>');
      html+='</div>';
    }
  }

  html+='<div class="strat-section"><h4>📊 Escassez por Posição</h4>';
  ['QB','RB','WR','TE'].forEach(pos=>{
    const drafted=posDrafted[pos];
    const avail=posAvailable[pos];
    const total=drafted+avail;
    const pctDrafted=total>0?Math.round(drafted/total*100):0;
    const color=pctDrafted>60?'var(--r2)':pctDrafted>40?'var(--y2)':'var(--g2)';
    html+='<div class="strat-item">';
    html+='<span class="pos pb-'+(POS_CLR[pos]||'ac')+'">'+pos+'</span>';
    html+='<span style="flex:1">'+drafted+'/'+total+' drafteados ('+pctDrafted+'%)</span>';
    html+='<span style="color:'+color+';font-weight:800">'+avail+' restantes</span>';
    html+='</div>';
  });
  html+='</div>';

  if(available.length&&nextPick){
    const pickOverall=nextPick.overall;
    const steals=available.filter(p=>p.proj_adp&&(p.proj_adp-pickOverall)>5).slice(0,3);
    if(steals.length){
      html+='<div class="strat-section"><h4>💎 Values Caindo</h4>';
      steals.forEach(p=>{
        const diff=Math.round(p.proj_adp-pickOverall);
        html+='<div class="strat-item">';
        html+='<span class="pos pb-'+(POS_CLR[p.p]||'ac')+'">'+p.p+'</span>';
        html+='<span class="pn">'+p.n+'</span>';
        html+='<span class="val">-'+diff+' do ADP</span>';
        html+='</div>';
      });
      html+='</div>';
    }
  }

  el.innerHTML=html||'<div style="color:var(--dim)">Draft não começou ainda</div>';
}

function mobCycle(){
  state.mobPage=(state.mobPage+1)%3;
  PAGES.forEach((c,i)=>{
    const el=document.getElementById(c);
    if(i===state.mobPage)el.classList.remove('mobile-hidden');
    else el.classList.add('mobile-hidden');
  });
  document.getElementById('mobBtn').textContent=['R','B','A'][state.mobPage];
}

function switchTab(tabId,btnEl){
  const isMobile=window.innerWidth<=1024;
  const activeClass=isMobile?(window.innerWidth<=767?'mobile-active':'tablet-active'):'';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btnEl.classList.add('active');
  ['col-left','col-center','col-right'].forEach(c=>{
    const el=document.getElementById(c);
    el.classList.remove('mobile-active','tablet-active');
    if(c===tabId)el.classList.add(activeClass);
  });
}

function initTabState(){
  const isMobile=window.innerWidth<=1024;
  if(isMobile){
    const activeClass=window.innerWidth<=767?'mobile-active':'tablet-active';
    ['col-left','col-center','col-right'].forEach(c=>{
      const el=document.getElementById(c);
      el.classList.remove('mobile-active','tablet-active');
    });
    document.getElementById('col-center').classList.add(activeClass);
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="col-center"]').classList.add('active');
  }else{
    ['col-left','col-center','col-right'].forEach(c=>{
      document.getElementById(c).classList.remove('mobile-active','tablet-active');
    });
  }
}

/* ═══════════════════════════════════════ */
/* SLEEPER PROJECTIONS + TIERS            */
/* ═══════════════════════════════════════ */
let projectionsLoaded=false;

async function loadProjections(){
  try{
    const cached=localStorage.getItem('proj_cache');
    const ct=localStorage.getItem('proj_ct');
    if(cached&&ct&&(Date.now()-parseInt(ct))<86400000){
      applyProjections(JSON.parse(cached));
      return;
    }
    setSync('ld','A carregar projections...');
    const r=await fetch(PROJ_API);
    if(!r.ok)throw new Error('Proj API');
    const data=await r.json();
    const projArray=Array.isArray(data)?data:Object.values(data).flat();
    localStorage.setItem('proj_cache',JSON.stringify(projArray));
    localStorage.setItem('proj_ct',String(Date.now()));
    applyProjections(projArray);
  }catch(e){
    console.error('Projections failed:',e);
  }
}

function applyProjections(projArray){
  if(!projArray||!projArray.length)return;
  const projMap={};
  projArray.forEach(p=>{
    if(!p||!p.player||!p.stats)return;
    const name=((p.player.first_name||'')+' '+(p.player.last_name||'')).trim();
    const key=name.toLowerCase().replace(/[^a-z]/g,'');
    const pos=p.player.position;
    if(!pos||!['QB','RB','WR','TE'].includes(pos))return;
    const pts=p.stats.pts_ppr||p.stats.pts_half_ppr||p.stats.pts_std||0;
    const adp=p.stats.adp_ppr||p.stats.adp_half_ppr||999;
    if(!projMap[key]||pts>projMap[key].pts){
      projMap[key]={pts,adp,team:p.player.team||p.team,pos};
    }
  });

  PLAYERS.forEach(p=>{
    const key=p.n.toLowerCase().replace(/[^a-z]/g,'');
    const proj=projMap[key];
    if(proj){
      p.proj_pts=proj.pts;
      p.proj_adp=proj.adp;
      p.proj_team=proj.team;
    }
  });

  calculateTiers();
  projectionsLoaded=true;
  renderAll();
}

function calculateTiers(){
  POSITIONS.forEach(pos=>{
    const players=PLAYERS.filter(p=>p.p===pos&&p.proj_pts!=null);
    if(!players.length)return;
    players.sort((a,b)=>b.proj_pts-a.proj_pts);
    const pts=players.map(p=>p.proj_pts);
    const max=pts[0]||1;
    players.forEach((p,i)=>{
      const pct=p.proj_pts/max;
      if(pct>=0.85)p.ti=1;
      else if(pct>=0.72)p.ti=2;
      else if(pct>=0.58)p.ti=3;
      else if(pct>=0.44)p.ti=4;
      else if(pct>=0.30)p.ti=5;
      else if(pct>=0.18)p.ti=6;
      else p.ti=7;
      p.r=i+1;
    });
  });
  renderAll();
}

async function loadSleeperPlayers(){
  try{
    const cached=localStorage.getItem('slp_cache');
    const ct=localStorage.getItem('slp_ct');
    if(cached&&ct&&(Date.now()-parseInt(ct))<86400000){
      state.sleeperPlayers=JSON.parse(cached);
      return;
    }
    setSync('ld','A carregar jogadores...');
    const r=await fetch(API+'/players/nfl');
    if(!r.ok)throw new Error('API');
    state.sleeperPlayers=await r.json();
    localStorage.setItem('slp_cache',JSON.stringify(state.sleeperPlayers));
    localStorage.setItem('slp_ct',String(Date.now()));
    if(state.draftPicks.length)markDraftedFromPicks();
  }catch(e){
    console.error('Players load failed:',e);
  }
}
