<html lang="pt">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Fantasy 2026 Draft Board</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--s1:#161b22;--s2:#21262d;--bd:#30363d;--tx:#c9d1d9;--dim:#8b949e;--ac:#58a6ff;
--t1:#ff6b6b;--t2:#ffa94d;--t3:#ffd43b;--t4:#69db7c;--t5:#74c0fc;--t6:#b197fc;--t7:#f783ac;
--qb:#e64980;--rb:#20c997;--wr:#339af0;--te:#fcc419;--k:#868e96;--ds:#ae3ec9}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;line-height:1.3}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:var(--s1);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-title{font-size:15px;font-weight:700;color:var(--ac);white-space:nowrap}
.hdr-title small{font-weight:400;color:var(--dim);font-size:11px}
.hdr-center{display:flex;gap:12px;align-items:center;flex:1;justify-content:center;flex-wrap:wrap}
.hdr-info{background:var(--s2);padding:4px 10px;border-radius:6px;font-size:11px;white-space:nowrap}
.hdr-info b{color:var(--ac)}
.hdr-right{display:flex;gap:8px;align-items:center}
.sync{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.sync.off{background:var(--s2);color:var(--dim)}.sync.ld{background:#3d2e00;color:#f0b429;animation:pulse 1.5s infinite}
.sync.ok{background:#0d2818;color:#3fb950}.sync.er{background:#3d1418;color:#f85149}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sync.ld .dot{animation:pulse 1s infinite}

/* CONNECT BAR */
.conn{background:var(--s1);border-bottom:1px solid var(--bd);padding:6px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.conn input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;color:var(--tx);font-size:12px}
.conn input::placeholder{color:#484f58}
.conn select{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;color:var(--tx);font-size:11px;max-width:180px}
.btn{padding:5px 12px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.btn-g{background:#238636;color:#fff}.btn-r{background:#da3633;color:#fff}.btn-s{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}

/* MAIN 3-COL */
.main{display:grid;grid-template-columns:180px 1fr 200px;gap:0;min-height:calc(100vh - 80px)}
.col{overflow-y:auto;max-height:calc(100vh - 80px)}
.col-left{border-right:1px solid var(--bd);background:var(--s1)}
.col-right{border-left:1px solid var(--bd);background:var(--s1)}
.col-center{background:var(--bg);padding:8px}

/* LEFT - MY ROSTER */
.roster-hdr{padding:8px 10px;border-bottom:1px solid var(--bd);font-weight:700;font-size:12px;color:var(--ac);position:sticky;top:0;background:var(--s1);z-index:2}
.roster-slot{display:flex;align-items:center;padding:5px 10px;border-bottom:1px solid rgba(48,54,61,.4);gap:6px;font-size:11px}
.roster-pos{font-weight:700;min-width:36px;color:var(--dim);text-transform:uppercase;font-size:10px}
.roster-player{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.roster-empty{color:#484f58;font-style:italic}
.roster-team{font-size:9px;padding:1px 4px;background:var(--s2);border-radius:3px;color:var(--dim)}
.roster-picks{padding:8px 10px;border-top:1px solid var(--bd);font-size:10px;color:var(--dim)}
.roster-picks b{color:var(--te)}

/* CENTER - DRAFT BOARD */
.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.board-panel{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.board-panel-hdr{padding:6px 8px;font-weight:700;font-size:11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;position:sticky;top:0;background:var(--s1);z-index:1}
.board-panel-hdr .pb{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:800}
.pb-qb{background:var(--qb);color:#000}.pb-rb{background:var(--rb);color:#000}.pb-wr{background:var(--wr);color:#000}
.pb-te{background:var(--te);color:#000}.pb-k{background:var(--k);color:#000}.pb-ds{background:var(--ds);color:#000}
.board-panel-body{overflow-y:auto;max-height:calc((100vh - 140px)/2 - 20px);flex:1}
.tier-hdr{display:flex;align-items:center;gap:5px;padding:4px 8px;background:var(--s2);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);border-bottom:1px solid var(--bd)}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.prow{display:flex;align-items:center;padding:3px 8px;gap:5px;border-bottom:1px solid rgba(48,54,61,.3);font-size:11px;cursor:pointer}
.prow:hover{background:rgba(88,166,255,.05)}
.prow.done{opacity:.3}.prow.done .pn{text-decoration:line-through}
.pchk{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;cursor:pointer}
.pchk.on{background:var(--ac);border-color:var(--ac)}
.pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ptm{font-size:9px;padding:1px 4px;background:var(--s2);border-radius:3px;color:var(--dim);font-weight:600}

/* RIGHT - BEST AVAILABLE */
.bpa-hdr{padding:8px 10px;border-bottom:1px solid var(--bd);font-weight:700;font-size:12px;color:var(--ac);position:sticky;top:0;background:var(--s1);z-index:2}
.bpa-row{display:flex;align-items:center;padding:4px 10px;gap:6px;border-bottom:1px solid rgba(48,54,61,.3);font-size:11px}
.bpa-rank{min-width:18px;color:var(--dim);font-weight:700;font-size:10px;text-align:right}
.bpa-pos{font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px;min-width:26px;text-align:center}
.bpa-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bpa-adp{font-size:9px;min-width:24px;text-align:right;font-weight:700}
.bpa-adp.steal{color:#3fb950}.bpa-adp.fair{color:#f0b429}.bpa-adp.reach{color:#f85149}
.bpa-tm{font-size:9px;color:var(--dim)}
.prow .adp-tag{font-size:8px;padding:1px 4px;border-radius:3px;font-weight:700;margin-left:4px}
.adp-steal{background:#0d2818;color:#3fb950}.adp-fair{background:#3d2e00;color:#f0b429}.adp-reach{background:#3d1418;color:#f85149}

/* STRATEGY PANEL */
.strat{background:var(--s1);border:1px solid var(--bd);border-radius:6px;margin-top:8px;overflow:hidden}
.strat-hdr{padding:6px 8px;font-weight:700;font-size:11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;background:var(--s2)}
.strat-hdr .icon{font-size:14px}
.strat-body{padding:8px;font-size:11px;line-height:1.5}
.strat-section{margin-bottom:8px}
.strat-section h4{font-size:10px;color:var(--ac);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.strat-item{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid rgba(48,54,61,.3)}
.strat-item .pos{font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px;min-width:26px;text-align:center}
.strat-item .val{color:#3fb950;font-weight:700;font-size:10px}
.strat-alert{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:4px;padding:6px;margin-top:6px;font-size:10px;color:#f85149}
.strat-tip{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);border-radius:4px;padding:6px;margin-top:6px;font-size:10px;color:#3fb950}

/* BOTTOM BAR */
.bbar{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--bd);padding:6px 12px;display:flex;gap:6px;overflow-x:auto;z-index:100;white-space:nowrap}
.bbar-label{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;padding:3px 0;flex-shrink:0}
.bpick{font-size:10px;padding:3px 8px;background:var(--s2);border-radius:4px;flex-shrink:0}
.bpick b{color:var(--ac)}
.bpick span{color:var(--dim)}

/* MOBILE */
.mob-toggle{display:none;position:fixed;bottom:40px;right:10px;z-index:200;background:var(--ac);color:#000;border:none;border-radius:50%;width:40px;height:40px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
@media(max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .col-left,.col-right{max-height:none;border:none;border-bottom:1px solid var(--bd)}
  .col-left{order:1}.col-center{order:2;min-height:50vh}.col-right{order:3}
  .board-panel-body{max-height:250px}
  .col.mobile-hidden{display:none}
  .mob-toggle{display:block}
}
@media(min-width:901px){.mob-toggle{display:none!important}}
</style>
</head>

{n:"Pittsburgh Steelers",t:"PIT",p:"DST",ti:2,r:5},{n:"Los Angeles Chargers",t:"LAC",p:"DST",ti:3,r:6},
{n:"New England Patriots",t:"NE",p:"DST",ti:3,r:7},{n:"Minnesota Vikings",t:"MIN",p:"DST",ti:3,r:8},
{n:"Philadelphia Eagles",t:"PHI",p:"DST",ti:3,r:9},{n:"Green Bay Packers",t:"GB",p:"DST",ti:3,r:10}
];
const PLAYERS=C.map(p=>({...p}));
const POSITIONS=['QB','RB','WR','TE','K','DST'];
const TIERS={1:'Tier 1',2:'Tier 2',3:'Tier 3',4:'Tier 4',5:'Tier 5',6:'Tier 6',7:'Tier 7'};
const PROJ_API='https://api.sleeper.com/projections/nfl/2026?season_type=regular';

let state={
  drafted:{},
  sleeperPlayers:null,
  draftPicks:[],
  users:[],
  rosters:[],

  slotToRoster:{},

  pickTimer:120,
  totalRounds:15,
  numTeams:12,
  search:'',
  mobPage:1
};

function saveDrafted(){localStorage.setItem('nfld26',JSON.stringify(state.drafted))}

/* ═══════════════════════════════════════ */
/* SLEEPER API                            */
/* ═══════════════════════════════════════ */
function setSync(c,t){const b=document.getElementById('syncBadge'),x=document.getElementById('syncTxt');b.className='sync '+c;x.textContent=t}

async function doConnect(){
  const input=document.getElementById('leagueIn').value.trim();
  if(!input)return;
  setSync('ld','A ligar...');
  document.getElementById('connBtn').textContent='...';
  try{
    const lid=input.replace(/.*\//,'');
    const lr=await fetch(API+'/league/'+lid);
    if(!lr.ok)throw new Error('Liga não encontrada');
    const ld=await lr.json();
    state.leagueId=lid;
    state.draftId=ld.draft_id;
    state.numTeams=ld.total_rosters||12;
    state.totalRounds=(ld.settings&&ld.settings.draft_rounds)||15;

    const dr=await fetch(API+'/draft/'+state.draftId);
    if(!dr.ok)throw new Error('Draft não encontrado');
    const dd=await dr.json();
    state.draftOrder=dd.draft_order||{};
    state.slotToRoster=dd.slot_to_roster_id||{};
    state.pickTimer=(dd.settings&&dd.settings.pick_timer)||120;
    if(dd.settings){state.totalRounds=dd.settings.rounds||state.totalRounds;state.numTeams=dd.settings.teams||state.numTeams}

    const pr=await fetch(API+'/draft/'+state.draftId+'/picks');
    if(pr.ok){state.draftPicks=await pr.json()||[]}
    state.draftStatus=dd.status||'pre_draft';

    const ur=await fetch(API+'/league/'+lid+'/users');
    if(ur.ok){state.users=await ur.json()||[]}

    const rr=await fetch(API+'/league/'+lid+'/rosters');
    if(rr.ok){state.rosters=await rr.json()||[]}

    populateUsers();
    setSync('ok','Ligado');
    document.getElementById('connBtn').textContent='Ligar';
    document.getElementById('discBtn').style.display='';
    document.getElementById('discBtn').onclick=doDisconnect;

    if(state.userId)identifyUser();
    markDraftedFromPicks();
    startPolling();
    renderAll();
  }catch(e){
    console.error('Connect error:',e);
    setSync('er','Erro: '+e.message);
    document.getElementById('connBtn').textContent='Ligar';
  }
}

function doDisconnect(){
  if(state.pollTimer){clearInterval(state.pollTimer);state.pollTimer=null}
  state.draftPicks=[];state.users=[];state.rosters=[];state.draftOrder={};state.slotToRoster={};
  state.draftId=null;state.draftStatus='pre_draft';state.userRosterId=null;
  setSync('off','Offline');
  document.getElementById('discBtn').style.display='none';
  document.getElementById('userSel').innerHTML='<option value="">Select your team...</option>';
  document.getElementById('hRound').textContent='Round: --';
  document.getElementById('hClock').textContent='Clock: --';
  document.getElementById('hNext').style.display='none';
  renderAll();
}

function populateUsers(){
  const sel=document.getElementById('userSel');
  sel.innerHTML='<option value="">Select your team...</option>';
  state.users.filter(u=>!u.is_bot).forEach(u=>{
    const opt=document.createElement('option');
    opt.value=u.user_id;
    opt.textContent=u.metadata&&u.metadata.team_name?u.metadata.team_name:u.display_name;
    if(u.user_id===state.userId)opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=function(){state.userId=this.value;localStorage.setItem('sleeper_uid',this.value);identifyUser();renderAll()};
}

function identifyUser(){
  if(!state.userId||!state.rosters.length)return;
  const roster=state.rosters.find(r=>r.owner_id===state.userId);
  state.userRosterId=roster?roster.roster_id:null;
}

function markDraftedFromPicks(){
  state.draftPicks.forEach(p=>{
    if(p.player_id&&p.player_id!=='0'&&p.player_id!=='Avoid'){
      const key=String(p.player_id);
      state.drafted[key]={by:'sleeper',pick:p.pick,round:p.round,roster_id:p.roster_id};
    }
  });
}

function startPolling(){
  if(state.pollTimer)clearInterval(state.pollTimer);
  state.pollTimer=setInterval(async()=>{
    try{
      const pr=await fetch(API+'/draft/'+state.draftId+'/picks');
      if(pr.ok){
        const picks=await pr.json()||[];
        if(picks.length!==state.draftPicks.length){
          state.draftPicks=picks;
          markDraftedFromPicks();
          renderAll();
        }
      }
    }catch(e){console.error('Poll error:',e)}
  },10000);
}

/* ═══════════════════════════════════════ */
/* DRAFT MATH                             */
/* ═══════════════════════════════════════ */
function overallToRoundPick(overall){
  const t=state.numTeams;
  const round=Math.ceil(overall/t);
  const pos=(overall-1)%t;
  const pickInRound=round%2===1?pos+1:t-pos;
  return{round,pickInRound};
}

function getTeamOnClock(){
  if(!state.draftId||state.draftPicks.length===0)return null;
  const next=state.draftPicks.length+1;
  const rp=overallToRoundPick(next);
  const slotPos=(next-1)%state.numTeams;
  const actualSlot=state.numTeams-slotPos;
  const rosterId=state.slotToRoster[String(actualSlot)];
  if(!rosterId)return null;
  const user=state.users.find(u=>{
    const r=state.rosters.find(r=>r.roster_id===rosterId);
    return r&&r.owner_id===u.user_id;
  });
  return{overall:next,...rp,teamName:user?(user.metadata&&user.metadata.team_name||user.display_name):'?',rosterId};
}

function getNextPickForUser(){
  if(!state.userRosterId)return null;
  const startRd=state.draftPicks.length+1;
  for(let i=startRd;i<=state.totalRounds*state.numTeams;i++){
    const rp=overallToRoundPick(i);
    const slotPos=(i-1)%state.numTeams;
    const actualSlot=state.numTeams-slotPos;
    const rosterId=state.slotToRoster[String(actualSlot)];
    if(rosterId===state.userRosterId)return{overall:i,...rp};
  }
  return null;
}

function getUserPicks(){
  if(!state.userRosterId)return[];
  const picks=[];
  for(let i=1;i<=state.totalRounds*state.numTeams;i++){
    const slotPos=(i-1)%state.numTeams;
    const actualSlot=state.numTeams-slotPos;
    const rosterId=state.slotToRoster[String(actualSlot)];
    if(rosterId===state.userRosterId)picks.push(i);
  }
  return picks;
}

/* ═══════════════════════════════════════ */
/* TOGGLE DRAFTED                         */
/* ═══════════════════════════════════════ */
function toggleP(idx){
  const p=PLAYERS[idx];
  const key=p.n+'|'+p.p;
  if(state.drafted[key]){delete state.drafted[key]}
  else{state.drafted[key]={by:'manual'}}
  saveDrafted();
  renderAll();
}

function isDrafted(p){
  const key=p.n+'|'+p.p;
  if(state.drafted[key])return true;
  if(state.sleeperPlayers){
    const sid=findSid(p);
    if(sid&&state.drafted[String(sid)])return true;
  }
  return false;
}

function findSid(p){
  if(!state.sleeperPlayers)return null;
  const nl=p.n.toLowerCase().replace(/[^a-z]/g,'');
  for(const id in state.sleeperPlayers){
    const sp=state.sleeperPlayers[id];
    const sn=((sp.full_name||(sp.first_name||'')+(sp.last_name||'')).toLowerCase().replace(/[^a-z]/g,''));
    if(sn===nl&&(sp.position===p.p||(sp.fantasy_positions&&sp.fantasy_positions.includes(p.p))))return id;
  }
  return null;
}

function getPlayerNameBySleeperId(id){
  if(!state.sleeperPlayers||!state.sleeperPlayers[id])return'Player #'+id;
  const sp=state.sleeperPlayers[id];
  return sp.full_name||(sp.first_name||'')+' '+(sp.last_name||'');
}

/* RENDER                                 */
/* ═══════════════════════════════════════ */
function renderAll(){
  renderHeader();
  renderRoster();
  renderBoard();
  renderBPA();
  renderStrategy();
  renderBottomBar();
}

function renderHeader(){
  const total=state.totalRounds*state.numTeams;
  const done=state.draftPicks.length;
  const gT=document.getElementById('hRound');
  if(done===0){gT.innerHTML='Draft: <b>pre-draft</b> ('+state.totalRounds+'rds / '+state.numTeams+'tms)'}
  else{
    const rp=overallToRoundPick(done+1);
    gT.innerHTML='R'+rp.round+' P'+rp.pickInRound+' ('+done+'/'+total+')';
  }
  const ck=document.getElementById('hClock');
  const clock=getTeamOnClock();
  if(clock){ck.innerHTML='Clock: <b>'+clock.teamName+'</b>'}
  else if(done===0){ck.innerHTML='Clock: <b>--</b>'}
  else{ck.innerHTML='Draft: <b>Completo!</b>'}

  const hN=document.getElementById('hNext');
  if(state.userRosterId){
    const np=getNextPickForUser();
    if(np){hN.style.display='';hN.innerHTML='Next: <b>R'+np.round+' P'+np.pickInRound+'</b> (#'+np.overall+')'}
    else{hN.style.display='none'}
  }else{hN.style.display='none'}
}

function renderRoster(){
  const el=document.getElementById('rosterSlots');
  let html='';
  SLOTS.forEach((slot,i)=>{
    const posLabel=slot==='DEF'?'DST':slot;
    const assigned=getRosterPlayerForSlot(i);
    html+='<div class="roster-slot"><span class="roster-pos">'+slot+'</span>';
    if(assigned){
      html+='<span class="roster-player" style="color:#f0f6fc">'+assigned.n+'</span><span class="roster-team">'+assigned.t+'</span>';
    }else{
      html+='<span class="roster-player roster-empty">'+posLabel+'</span>';
    }
    html+='</div>';
  });
  el.innerHTML=html;

  const pk=document.getElementById('rosterPicks');
  const userPicks=getUserPicks();
  if(userPicks.length){
    pk.innerHTML='Picks: '+userPicks.map(p=>'<b>#'+p+'</b>').join(', ');
  }else{
    pk.innerHTML=state.userId?'Nenhum pick restante':'Select your team ↑';
  }
}

function getRosterPlayerForSlot(slotIdx){
  if(!state.userRosterId||state.draftPicks.length===0)return null;
  const myPicks=state.draftPicks.filter(p=>p.roster_id===state.userRosterId).sort((a,b)=>a.round-b.round||a.pick-b.pick);
  if(slotIdx>=myPicks.length)return null;
  const pid=String(myPicks[slotIdx].player_id);
  if(!pid||pid==='0'||pid==='Avoid')return null;
  const nm=getPlayerNameBySleeperId(pid);
  const sp=state.sleeperPlayers?state.sleeperPlayers[pid]:null;
  return{n:nm,t:sp?sp.team:'?'};
}

function renderBoard(){
  const grid=document.getElementById('boardGrid');
  const panelMap=[
    [{pos:'QB',pb:'pb-qb'},{pos:'RB',pb:'pb-rb'},{pos:'WR',pb:'pb-wr'}],
    [{pos:'TE',pb:'pb-te'},{pos:'K',pb:'pb-k'},{pos:'DST',pb:'pb-ds'}]
  ];
  let html='';
  panelMap.forEach(row=>{
    row.forEach(({pos,pb})=>{
      html+='<div class="board-panel"><div class="board-panel-hdr"><span class="pb '+pb+'">'+pos+'</span>'+pos+'</div>';
      html+='<div class="board-panel-body">';
      const players=PLAYERS.filter(p=>p.p===pos);
      const tiers={};
      players.forEach(p=>{if(!tiers[p.ti])tiers[p.ti]=[];tiers[p.ti].push(p)});
      Object.keys(tiers).sort((a,b)=>a-b).forEach(t=>{
        const tp=tiers[t];
        html+='<div class="tier-hdr"><span class="tdot" style="background:'+TCLR[t]+'"></span>'+TIERS[t]+' ('+tp.length+')</div>';
        tp.forEach((p,pi)=>{
          const gi=PLAYERS.indexOf(p);
          const d=isDrafted(p);
          const nextOverall=state.draftPicks.length+1;
          const adpVal=p.proj_adp||null;
          let adpTag='';
          if(adpVal&&!d){
            const diff=adpVal-nextOverall;
            if(diff>3)adpTag='<span class="adp-tag adp-steal">STEAL</span>';
            else if(diff>=-2)adpTag='<span class="adp-tag adp-fair">ADP:'+Math.round(adpVal)+'</span>';
            else adpTag='<span class="adp-tag adp-reach">REACH</span>';
          }
          html+='<div class="prow'+(d?' done':'')+'" onclick="toggleP('+gi+')">';
          html+='<div class="pchk'+(d?' on':'')+'">'+(d?'✓':'')+'</div>';
          html+='<span class="pn">'+p.n+'</span>';
          if(p.proj_pts!=null)html+='<span style="font-size:9px;color:#3fb950;white-space:nowrap">'+Math.round(p.proj_pts)+'</span>';
          html+=adpTag;
          html+='<span class="ptm">'+p.t+'</span>';
          html+='</div>';
        });
      });
      html+='</div></div>';
    });
  });
  grid.innerHTML=html;
}

function renderBPA(){
  const el=document.getElementById('bpaList');
  const available=PLAYERS.filter(p=>!isDrafted(p));
  const posRank={};
  ['QB','RB','WR','TE','K','DST'].forEach(pos=>{
    let c=1;
    PLAYERS.filter(p=>p.p===pos).forEach(p=>{
      if(!isDrafted(p)){p._bpaRank=c;c++}
    });
  });
  const nextOverall=state.draftPicks.length+1;
  available.sort((a,b)=>(a._bpaRank||999)-(b._bpaRank||999));
  let html='';
  available.slice(0,60).forEach((p,i)=>{
    const pc=POS_CLR[p.p]||'ac';
    const adpVal=p.proj_adp||null;
    let adpClass='',adpText='';
    if(adpVal){
      const diff=adpVal-nextOverall;
      if(diff>3){adpClass='steal';adpText='STEAL'}
      else if(diff>=-2){adpClass='fair';adpText='ADP:'+Math.round(adpVal)}
      else{adpClass='reach';adpText='REACH'}
    }
    html+='<div class="bpa-row">';
    html+='<span class="bpa-rank">'+(i+1)+'</span>';
    html+='<span class="bpa-pos pb-'+pc+'">'+p.p+(p._bpaRank||'')+'</span>';
    html+='<span class="bpa-name">'+p.n+'</span>';
    if(adpText)html+='<span class="bpa-adp '+adpClass+'">'+adpText+'</span>';
    html+='<span class="bpa-tm">'+p.t+'</span>';
    html+='</div>';
  });
  if(!available.length)html='<div style="padding:20px;text-align:center;color:#484f58">Todos drafteados!</div>';
  el.innerHTML=html;
}

function renderBottomBar(){
  const el=document.getElementById('bbarPicks');
  if(!state.draftPicks.length){
    el.innerHTML='<span style="color:#484f58">Nenhuma pick ainda — draft não começou</span>';
    return;
  }
  const recent=state.draftPicks.slice(-15);
  el.innerHTML=recent.map(p=>{
    const nm=getPlayerNameBySleeperId(String(p.player_id));
    const user=state.users.find(u=>{
      const r=state.rosters.find(r=>r.roster_id===p.roster_id);
      return r&&r.owner_id===u.user_id;
    });
    const tn=user?(user.metadata&&user.metadata.team_name||user.display_name):'?';
    return'<span class="bpick"><b>#'+p.pick+'</b> '+nm+' <span>— '+tn+'</span></span>';
  }).join('');
}

/* ═══════════════════════════════════════ */
/* STRATEGY NOTES                         */
/* ═══════════════════════════════════════ */
function renderStrategy(){
  const el=document.getElementById('stratBody');
  if(!state.userRosterId){
    el.innerHTML='<div class="strat-tip">Selecione seu time para ver estratégias personalizadas.</div>';
    return;
  }

  const nextPick=getNextPickForUser();
  const available=PLAYERS.filter(p=>!isDrafted(p));
  const drafted=state.draftPicks;

  // Position scarcity analysis
  const posDrafted={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
  const posAvailable={QB:0,RB:0,WR:0,TE:0,DST:0};
  ['QB','RB','WR','TE','K','DST'].forEach(pos=>{
    posDrafted[pos]=drafted.filter(p=>{
      const sp=state.sleeperPlayers?state.sleeperPlayers[String(p.player_id)]:null;
      return sp&&sp.position===pos;
    }).length;
    posAvailable[pos]=PLAYERS.filter(p=>p.p===pos&&!isDrafted(p)).length;
  });

  let html='';

  // Position run alerts
  const totalPicks=drafted.length;
  if(totalPicks>0){
    const alerts=[];
    if(posDrafted.QB>=4&&posAvailable.QB>8)alerts.push('QB run em andamento - '+posDrafted.QB+' QBs drafteados');
    if(posDrafted.RB>=8&&posAvailable.RB>15)alerts.push('RB run em andamento - considere agarrar um agora');
    if(posDrafted.WR>=8&&posAvailable.WR>20)alerts.push('WR run em andamento - muitos ainda disponíveis');
    if(posDrafted.TE>=3&&posAvailable.TE>5)alerts.push('TE run em andamento - elite acabando');

    if(alerts.length){
      html+='<div class="strat-section"><h4>⚠️ Position Runs</h4>';
      alerts.forEach(a=>html+='<div class="strat-alert">'+a+'</div>');
      html+='</div>';
    }
  }

  // Suggested picks at next pick
  if(nextPick){
    const pickOverall=nextPick.overall;
    const bestByPos={};
    ['QB','RB','WR','TE'].forEach(pos=>{
      const posPlayers=PLAYERS.filter(p=>p.p===pos&&!isDrafted(p));
      if(posPlayers.length){
        const best=posPlayers[0];
        const adpDiff=best.proj_adp?best.proj_adp-pickOverall:0;
        bestByPos[pos]={player:best,adpDiff,value:adpDiff>2?'Excelente valor':adpDiff>0?'Bom valor':adpDiff>-2?'Justo':'Reach'};
      }
    });

    html+='<div class="strat-section"><h4>🎯 Melhores Opções no Pick #'+pickOverall+' (R'+nextPick.round+'P'+nextPick.pickInRound+')</h4>';
    Object.entries(bestByPos).sort((a,b)=>(b[1].player.proj_pts||0)-(a[1].player.proj_pts||0)).forEach(([pos,{player,adpDiff,value}])=>{
      const pc=POS_CLR[pos]||'ac';
      html+='<div class="strat-item">';
      html+='<span class="pos pb-'+pc+'">'+pos+'</span>';
      html+='<span class="pn">'+player.n+' ('+player.t+')</span>';
      html+='<span class="val">'+value+'</span>';
      html+='</div>';
    });
    html+='</div>';
  }

  // Trade targets
  if(totalPicks>0&&totalPicks<state.numTeams*4){
    const myPicks=state.draftPicks.filter(p=>p.roster_id===state.userRosterId);
    const myPositions={};
    myPicks.forEach(p=>{
      const sp=state.sleeperPlayers?state.sleeperPlayers[String(p.player_id)]:null;
      if(sp)myPositions[sp.position]=(myPositions[sp.position]||0)+1;
    });

    const tradeTargets=[];
    if(!myPositions.QB)tradeTargets.push('QB backup rodada 6-8');
    if((myPositions.RB||0)<2)tradeTargets.push('RB2 rodada 3-5');
    if((myPositions.WR||0)<2)tradeTargets.push('WR2 rodada 2-4');
    if(!myPositions.TE)tradeTargets.push('TE rodada 5-7');

    if(tradeTargets.length){
      html+='<div class="strat-section"><h4>🔄 Trade Targets</h4>';
      tradeTargets.forEach(t=>html+='<div class="strat-item"><span>'+t+'</span></div>');
      html+='</div>';
    }
  }

  // Position scarcity summary
  html+='<div class="strat-section"><h4>📊 Escassez por Posição</h4>';
  ['QB','RB','WR','TE'].forEach(pos=>{
    const drafted=posDrafted[pos];
    const avail=posAvailable[pos];
    const total=drafted+avail;
    const pctDrafted=total>0?Math.round(drafted/total*100):0;
    const color=pctDrafted>60?'#f85149':pctDrafted>40?'#f0b429':'#3fb950';
    html+='<div class="strat-item">';
    html+='<span class="pos pb-'+(POS_CLR[pos]||'ac')+'">'+pos+'</span>';
    html+='<span style="flex:1">'+drafted+'/'+total+' drafteados ('+pctDrafted+'%)</span>';
    html+='<span style="color:'+color+';font-weight:700">'+avail+' restantes</span>';
    html+='</div>';
  });
  html+='</div>';

  // Value recommendations
  if(available.length){
    const steals=available.filter(p=>p.proj_adp&&(p.proj_adp-pickOverall)>5).slice(0,3);
    if(steals.length){
      html+='<div class="strat-section"><h4>💎 Values Caindo</h4>';
      steals.forEach(p=>{
        const diff=Math.round(p.proj_adp-pickOverall);
        html+='<div class="strat-item">';
        html+='<span class="pos pb-'+(POS_CLR[p.p]||'ac')+'">'+p.p+'</span>';
        html+='<span class="pn">'+p.n+'</span>';
        html+='<span class="val">-'+diff+' do ADP</span>';
        html+='</div>';
      });
      html+='</div>';
    }
  }

  el.innerHTML=html||'<div style="color:#484f58">Draft não começou ainda</div>';
}
function mobCycle(){
  state.mobPage=(state.mobPage+1)%3;
  PAGES.forEach((c,i)=>{
    const el=document.getElementById(c);
    if(i===state.mobPage)el.classList.remove('mobile-hidden');
    else el.classList.add('mobile-hidden');
  });
  document.getElementById('mobBtn').textContent=['R','B','A'][state.mobPage];
}

/* ═══════════════════════════════════════ */
/* SLEEPER PROJECTIONS + TIERS            */
/* ═══════════════════════════════════════ */
let projectionsLoaded=false;

async function loadProjections(){
  try{
    const cached=localStorage.getItem('proj_cache');
    const ct=localStorage.getItem('proj_ct');
    if(cached&&ct&&(Date.now()-parseInt(ct))<86400000){
      applyProjections(JSON.parse(cached));
      return;
    }
    setSync('ld','A carregar projections...');
    const r=await fetch(PROJ_API);
    if(!r.ok)throw new Error('Proj API');
    const data=await r.json();
    const projArray=Array.isArray(data)?data:Object.values(data).flat();
    localStorage.setItem('proj_cache',JSON.stringify(projArray));
    localStorage.setItem('proj_ct',String(Date.now()));
    applyProjections(projArray);
  }catch(e){
    console.error('Projections failed:',e);
  }
}

function applyProjections(projArray){
  if(!projArray||!projArray.length)return;
  const projMap={};
  projArray.forEach(p=>{
    if(!p||!p.player||!p.stats)return;
    const name=((p.player.first_name||'')+' '+(p.player.last_name||'')).trim();
    const key=name.toLowerCase().replace(/[^a-z]/g,'');
    const pos=p.player.position;
    if(!pos||!['QB','RB','WR','TE'].includes(pos))return;
    const pts=p.stats.pts_ppr||p.stats.pts_half_ppr||p.stats.pts_std||0;
    const adp=p.stats.adp_ppr||p.stats.adp_half_ppr||999;
    if(!projMap[key]||pts>projMap[key].pts){
      projMap[key]={pts,adp,team:p.player.team||p.team,pos};
    }
  });

  PLAYERS.forEach(p=>{
    const key=p.n.toLowerCase().replace(/[^a-z]/g,'');
    const proj=projMap[key];
    if(proj){
      p.proj_pts=proj.pts;
      p.proj_adp=proj.adp;
      p.proj_team=proj.team;
    }
  });

  calculateTiers();
  projectionsLoaded=true;
  renderAll();
}

function calculateTiers(){
  POSITIONS.forEach(pos=>{
    const players=PLAYERS.filter(p=>p.p===pos&&p.proj_pts!=null);
    if(!players.length)return;
    players.sort((a,b)=>b.proj_pts-a.proj_pts);
    const pts=players.map(p=>p.proj_pts);
    const max=pts[0]||1;
    players.forEach((p,i)=>{
      const pct=p.proj_pts/max;
      if(pct>=0.85)p.ti=1;
      else if(pct>=0.72)p.ti=2;
      else if(pct>=0.58)p.ti=3;
      else if(pct>=0.44)p.ti=4;
      else if(pct>=0.30)p.ti=5;
      else if(pct>=0.18)p.ti=6;
      else p.ti=7;
      p.r=i+1;
    });
  });
  renderAll();
}
async function loadSleeperPlayers(){
  try{
    const cached=localStorage.getItem('slp_cache');
    const ct=localStorage.getItem('slp_ct');
    if(cached&&ct&&(Date.now()-parseInt(ct))<86400000){
      state.sleeperPlayers=JSON.parse(cached);
      return;
    }
    setSync('ld','A carregar jogadores...');
    const r=await fetch(API+'/players/nfl');
    if(!r.ok)throw new Error('API');
    state.sleeperPlayers=await r.json();
    localStorage.setItem('slp_cache',JSON.stringify(state.sleeperPlayers));
    localStorage.setItem('slp_ct',String(Date.now()));
    if(state.draftPicks.length)markDraftedFromPicks();
  }catch(e){
    console.error('Players load failed:',e);
  }
}

loadSleeperPlayers().then(()=>{renderAll()});
